name: pricing-service

services:
    pricing-gateway:
        build:
            context: ..
            dockerfile: pricing_service/Dockerfile
        image: pricing-service-py:new
        pull_policy: build
        env_file:
            - ../.env
        ports:
            - "${PRICING_GATEWAY_PORT:-8080}:80"
            - "${PRICING_VISION_PORT:-8081}:81"
        restart: unless-stopped
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "wget -q --spider http://127.0.0.1:81/GV || exit 1",
                ]
            interval: 10s
            timeout: 3s
            retries: 6
            start_period: 10s
